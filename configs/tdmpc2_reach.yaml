# TD-MPC2 на ReachEnv (вектор состояния). Лаб. 3. Сравнивать с sac_reach по числу шагов среды.
seed: 0
algo: tdmpc2

env:
  id: rwm/Reach-v0
  kwargs:
    obs_mode: state

train:
  total_steps: 100000
  seed_steps: 5000
  utd: 1
  buffer_size: 1000000
  log_every: 1000
  eval_every: 5000
  eval_episodes: 10
  device: auto

agent:
  latent_dim: 128
  hidden: 256
  num_q: 5
  num_bins: 101
  horizon: 3
  gamma: 0.99
  rho: 0.5
  lr: 3.0e-4
  tau: 0.01
  batch_size: 256
  grad_clip: 20.0
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  entropy_coef: 1.0e-4
  mpc: true            # false — действовать policy prior без планирования (абляция)
  num_samples: 512
  num_pi_trajs: 24
  iterations: 6
  num_elites: 64
  temperature: 0.5
  min_std: 0.05
  max_std: 2.0

log:
  dir: runs
  name: tdmpc2_reach
  tensorboard: false
