# Dreamer (RSSM) на ReachEnv по вектору состояния: отладка модели мира без свёрток.
seed: 0
algo: dreamer

env:
  id: rwm/Reach-v0
  kwargs:
    obs_mode: state

train:
  total_steps: 200000
  seed_steps: 5000
  utd: 1
  buffer_size: 1000000
  log_every: 1000
  eval_every: 5000
  eval_episodes: 10
  device: auto

agent:
  deter: 256
  hidden: 256
  stoch: 16
  classes: 16
  batch_size: 32
  seq_len: 32
  horizon: 15
  gamma: 0.997
  lam: 0.95
  beta_dyn: 0.5
  beta_rep: 0.1
  free_bits: 1.0
  entropy_coef: 3.0e-4
  lr_model: 1.0e-4
  lr_actor: 3.0e-5
  lr_critic: 3.0e-5
  critic_tau: 0.02
  update_every: 1

log:
  dir: runs
  name: dreamer_reach_state
  tensorboard: false
